<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Penjualan | Jerami Coffee</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f4f4;
display:flex;
}

/* Sidebar */

.sidebar{
width:230px;
height:100vh;
background:#6F4E37;
color:white;
padding:20px;
position:fixed;
}

.sidebar h2{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
padding:12px;
margin:8px 0;
text-decoration:none;
color:white;
border-radius:8px;
}

.sidebar a:hover{
background:#8B5E3C;
}

/* Main */

.main{
margin-left:230px;
width:100%;
padding:25px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

.statistik{
display:flex;
gap:20px;
margin-bottom:20px;
}

.box{
flex:1;
background:white;
padding:20px;
border-radius:10px;
text-align:center;
box-shadow:0 5px 10px rgba(0,0,0,.1);
}

.box h1{
color:#6F4E37;
margin-top:10px;
}

input{
padding:10px;
border:1px solid #ccc;
border-radius:8px;
margin-right:10px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 5px 10px rgba(0,0,0,.1);
}

th,td{
padding:12px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#6F4E37;
color:white;
}

button{
padding:8px 12px;
border:none;
border-radius:5px;
cursor:pointer;
margin:2px;
}

.detail{
background:#2196F3;
color:white;
}

.cetak{
background:green;
color:white;
}

.hapus{
background:red;
color:white;
}
/* ===========================
   RESPONSIVE HP & TABLET
=========================== */

@media (max-width: 768px){

body{
    display:block;
}

/* Sidebar menjadi atas */
.sidebar{
    position:relative;
    width:100%;
    height:auto;
    padding:15px;
}

.sidebar h2{
    margin-bottom:15px;
}

.sidebar a{
    display:inline-block;
    width:48%;
    margin:3px 1%;
    text-align:center;
    font-size:14px;
}

/* Main full */
.main{
    margin-left:0;
    width:100%;
    padding:15px;
}

/* Header */
.header{
    flex-direction:column;
    align-items:stretch;
    gap:10px;
}

.search{
    width:100%;
}

/* Produk & Keranjang */
.container{
    flex-direction:column;
}

.produk{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.keranjang{
    width:100%;
}

.card img{
    height:120px;
}

.card h3{
    font-size:15px;
}

.bayar{
    position:sticky;
    bottom:10px;
}

}

/* HP kecil */
@media (max-width:480px){

.produk{
    grid-template-columns:1fr;
}

.sidebar a{
    width:100%;
}

.card img{
    height:160px;
}

}
</style>

</head>
<body>

<div class="sidebar">

<h2>☕ Jerami Coffee</h2>

<a href="index.html">Dashboard</a>
<a href="kasir.html">Kasir</a>
<a href="menu.html">Kelola Menu</a>
<a href="riwayat.html">Riwayat</a>
   <a href="pengeluaran.html">💸 Pengeluaran</a>
<a href="laporan.html">Laporan</a>

</div>

<div class="main">

<div class="header">

<h2>Riwayat Penjualan</h2>

</div>

<div class="statistik">

<div class="box">

<h3>Total Transaksi</h3>

<h1 id="jumlahTransaksi">0</h1>

</div>

<div class="box">

<h3>Total Omzet</h3>

<h1 id="omzet">Rp0</h1>

</div>

</div>

<div class="card">

<input
type="text"
id="cari"
placeholder="Cari No Transaksi..."
onkeyup="cariData()">

<input
type="date"
id="tanggal"
onchange="filterTanggal()">

</div>

<table>

<thead>

<tr>

<th>No</th>
<th>No Transaksi</th>
<th>Tanggal</th>
<th>Total</th>
<th>Aksi</th>

</tr>

</thead>

<tbody id="tabel">

</tbody>

</table>

</div>

<script>

let riwayat=JSON.parse(localStorage.getItem("riwayat"))||[];

function tampil(data){

let html="";
let omzet=0;

data.forEach((item,index)=>{

omzet+=Number(item.total);

html+=`

<tr>

<td>${index+1}</td>

<td>${item.kode}</td>

<td>${item.tanggal}</td>

<td>Rp ${Number(item.total).toLocaleString('id-ID')}</td>

<td>

<button class="detail"
onclick="detail(${index})">

Detail

</button>

<button class="cetak"
onclick="cetak(${index})">

Cetak

</button>

<button class="hapus"
onclick="hapus(${index})">

Hapus

</button>

</td>

</tr>

`;

});

document.getElementById("tabel").innerHTML=html;

document.getElementById("jumlahTransaksi").innerHTML=data.length;

document.getElementById("omzet").innerHTML=
"Rp "+omzet.toLocaleString("id-ID");

}

function detail(i){

let item=riwayat[i];

alert(

"NO : "+item.kode+

"\nTanggal : "+item.tanggal+

"\nTotal : Rp "+Number(item.total).toLocaleString('id-ID')

);

}

function cetak(i){

localStorage.setItem("struk",JSON.stringify(riwayat[i]));

window.open("struk.html");

}

function hapus(i){

if(confirm("Hapus transaksi ini?")){

riwayat.splice(i,1);

localStorage.setItem("riwayat",JSON.stringify(riwayat));

tampil(riwayat);

}

}

function cariData(){

let key=document.getElementById("cari").value.toLowerCase();

let hasil=riwayat.filter(item=>

item.kode.toLowerCase().includes(key)

);

tampil(hasil);

}

function filterTanggal(){

let t=document.getElementById("tanggal").value;

let hasil=riwayat.filter(item=>

item.tanggal==t

);

tampil(hasil);

}

tampil(riwayat);

</script>

</body>
</html>
