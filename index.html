<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Jerami Coffee POS</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
display:flex;
background:#f5f5f5;
}

/* Sidebar */
.logo-box{
    text-align:center;
    margin-bottom:20px;
}

.logo-box img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #fff;
    background:white;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.logo-box h2{
    margin-top:10px;
    font-size:22px;
    color:white;
}

.logo-box p{
    font-size:12px;
    opacity:.8;
}
.sidebar{
width:240px;
height:100vh;
background:#6F4E37;
color:white;
position:fixed;
padding:20px;
}

.sidebar h2{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
padding:14px;
margin:8px 0;
color:white;
text-decoration:none;
border-radius:8px;
transition:.3s;
}

.sidebar a:hover{
background:#8B5E3C;
}

/* Main */

.main{
margin-left:240px;
padding:30px;
width:100%;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.header h1{
color:#6F4E37;
}

.admin{
font-weight:bold;
}

/* Card */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card h3{
color:#777;
margin-bottom:10px;
}

.card h1{
color:#6F4E37;
}

/* Menu Cepat */

.menu-cepat{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
}

.menu-box{
background:white;
padding:20px;
text-align:center;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
cursor:pointer;
transition:.3s;
}

.menu-box:hover{
transform:translateY(-5px);
background:#6F4E37;
color:white;
}

.menu-box h2{
margin-bottom:10px;
}

.logout{
background:#dc3545;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
}
/* ===========================
   RESPONSIVE HP & TABLET
=========================== */

@media (max-width: 768px){

body{
    display:block;
}

/* Sidebar menjadi atas */
.sidebar{
    position:relative;
    width:100%;
    height:auto;
    padding:15px;
}

.sidebar h2{
    margin-bottom:15px;
}

.sidebar a{
    display:inline-block;
    width:48%;
    margin:3px 1%;
    text-align:center;
    font-size:14px;
}

/* Main full */
.main{
    margin-left:0;
    width:100%;
    padding:15px;
}

/* Header */
.header{
    flex-direction:column;
    align-items:stretch;
    gap:10px;
}

.search{
    width:100%;
}

/* Produk & Keranjang */
.container{
    flex-direction:column;
}

.produk{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.keranjang{
    width:100%;
}

.card img{
    height:120px;
}

.card h3{
    font-size:15px;
}

.bayar{
    position:sticky;
    bottom:10px;
}

}

/* HP kecil */
@media (max-width:480px){

.produk{
    grid-template-columns:1fr;
}

.sidebar a{
    width:100%;
}

.card img{
    height:160px;
}

}
</style>

</head>
<body>

<div class="sidebar">

<div class="logo-box">

    <img src="logo.png" alt="Jerami Coffee">

    <h2>Jerami Coffee</h2>

    <p>POS System</p>

</div>

<a href="dashboard.html">🏠 Dashboard</a>

<a href="kasir.html">🛒 Kasir</a>

<a href="menu.html">📦 Kelola Menu</a>

<a href="riwayat.html">📋 Riwayat</a>

<a href="laporan.html">📊 Laporan</a>

</div>

<div class="main">

<div class="header">

<div>

<h1>Dashboard</h1>

<p class="admin">
Selamat Datang,
<span id="adminNama"></span>
</p>

</div>

<button class="logout" onclick="logout()">

Logout

</button>

</div>

<div class="cards">

<div class="card">

<h3>Total Menu</h3>

<h1 id="totalMenu">0</h1>

</div>

<div class="card">

<h3>Total Transaksi</h3>

<h1 id="totalTransaksi">0</h1>

</div>

<div class="card">

<h3>Omzet</h3>

<h1 id="omzet">Rp0</h1>

</div>

<div class="card">

<h3>Stok Hampir Habis</h3>

<h1 id="stokHabis">0</h1>

</div>

</div>

<div class="menu-cepat">

<div class="menu-box" onclick="location.href='kasir.html'">

<h2>🛒</h2>

Kasir

</div>

<div class="menu-box" onclick="location.href='menu.html'">

<h2>📦</h2>

Kelola Menu

</div>

<div class="menu-box" onclick="location.href='riwayat.html'">

<h2>📋</h2>

Riwayat

</div>

<div class="menu-box" onclick="location.href='laporan.html'">

<h2>📊</h2>

Laporan

</div>

</div>

</div>

<script>

// Cek Login
if(localStorage.getItem("login")!="true"){
location.href="login.html";
}

// Nama Admin
document.getElementById("adminNama").innerHTML=
localStorage.getItem("namaAdmin") || "Administrator";

// Ambil Data Menu
let menu=JSON.parse(localStorage.getItem("menu")) || [];

// Ambil Riwayat
let riwayat=JSON.parse(localStorage.getItem("riwayat")) || [];

// Total Menu
document.getElementById("totalMenu").innerHTML=menu.length;

// Total Transaksi
document.getElementById("totalTransaksi").innerHTML=riwayat.length;

// Hitung Omzet
let omzet=0;

riwayat.forEach(item=>{
omzet+=Number(item.total);
});

document.getElementById("omzet").innerHTML=
"Rp "+omzet.toLocaleString("id-ID");

// Hitung Stok Hampir Habis
let stok=0;

menu.forEach(item=>{
if(Number(item.stok)<=5){
stok++;
}
});

document.getElementById("stokHabis").innerHTML=stok;

// Logout
function logout(){

if(confirm("Yakin ingin logout?")){

localStorage.removeItem("login");

localStorage.removeItem("namaAdmin");

location.href="login.html";

}

}

</script>

</body>
</html>
