<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Struk Jerami Coffee</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Courier New', monospace;
}

body{
    background:#ececec;
    display:flex;
    justify-content:center;
    padding:20px;
}

.container{
    width:340px;
}

.struk{
    background:#fff;
    padding:15px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

.center{text-align:center;}

.logo{
    font-size:22px;
    font-weight:bold;
}

hr{
    border:none;
    border-top:1px dashed #000;
    margin:8px 0;
}

.info{
    font-size:12px;
    line-height:18px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

th{
    border-bottom:1px dashed #000;
    padding:4px 0;
}

td{
    padding:4px 0;
    vertical-align:top;
}

.right{text-align:right;}

.total{
    font-size:16px;
    font-weight:bold;
}

.footer{
    text-align:center;
    font-size:12px;
    margin-top:10px;
}

.btn{
    margin-top:15px;
    display:grid;
    gap:10px;
}

button{
    padding:12px;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
    font-size:15px;
}

.print{background:#28a745;}
.pdf{background:#2196F3;}
.wa{
    background:#25D366;
}
.home{background:#6F4E37;}

.star{
    font-size:28px;
    color:#ccc;
    cursor:pointer;
}

.active{
    color:gold;
}

@media print{
    body{
        background:white;
        padding:0;
    }
    .btn{
        display:none;
    }
    .struk{
        box-shadow:none;
        width:80mm;
    }
}
/* ===========================
   RESPONSIVE HP & TABLET
=========================== */

@media (max-width: 768px){

body{
    display:block;
}

/* Sidebar menjadi atas */
.sidebar{
    position:relative;
    width:100%;
    height:auto;
    padding:15px;
}

.sidebar h2{
    margin-bottom:15px;
}

.sidebar a{
    display:inline-block;
    width:48%;
    margin:3px 1%;
    text-align:center;
    font-size:14px;
}

/* Main full */
.main{
    margin-left:0;
    width:100%;
    padding:15px;
}

/* Header */
.header{
    flex-direction:column;
    align-items:stretch;
    gap:10px;
}

.search{
    width:100%;
}

/* Produk & Keranjang */
.container{
    flex-direction:column;
}

.produk{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.keranjang{
    width:100%;
}

.card img{
    height:120px;
}

.card h3{
    font-size:15px;
}

.bayar{
    position:sticky;
    bottom:10px;
}

}

/* HP kecil */
@media (max-width:480px){

.produk{
    grid-template-columns:1fr;
}

.sidebar a{
    width:100%;
}

.card img{
    height:160px;
}

}
</style>

</head>
<body>

<div class="container">

<div class="struk" id="printArea">

<div class="center">
<div class="logo">☕ JERAMI COFFEE</div>
<p>Fresh Coffee & Mocktail</p>
<p>Medan, Sumatera Utara</p>
</div>

<hr>

<div class="info">
No : <span id="no"></span><br>
Tanggal : <span id="tanggal"></span><br>
Jam : <span id="jam"></span><br>
Kasir : <span id="kasir"></span><br>
Pembayaran : <span id="metode"></span>
</div>

<hr>

<table>
<thead>
<tr>
<th align="left">Menu</th>
<th>Qty</th>
<th class="right">Subtotal</th>
</tr>
</thead>

<tbody id="isiStruk"></tbody>

</table>

<hr>

<table>
<tr>
<td class="total">TOTAL</td>
<td class="right total" id="total"></td>
</tr>
</table>

<hr>

<div class="footer">

**🙏 TERIMA KASIH 🙏**

Selamat menikmati ☕

<br><br>

**Berikan Penilaian**

<div id="rating" style="margin-top:5px;">
<span class="star" onclick="rating(1)">☆</span>
<span class="star" onclick="rating(2)">☆</span>
<span class="star" onclick="rating(3)">☆</span>
<span class="star" onclick="rating(4)">☆</span>
<span class="star" onclick="rating(5)">☆</span>
</div>

<p id="hasilRating"></p>

</div>

</div>
<div style="margin-top:15px;">
    <input
        type="tel"
        id="wa"
        placeholder="089531416689"
        style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-family:Segoe UI,sans-serif;">
</div>
<div class="btn">

<button class="print" onclick="window.print()">
🖨 Cetak Struk
</button>

<button class="pdf" onclick="downloadPDF()">
📥 Download PDF
</button>
<button class="wa" onclick="kirimWA()">
📲 Kirim ke WhatsApp
</button>
<button class="home" onclick="window.location.href='dashboard.html'">
🏠 Dashboard
</button>

</div>

</div>

<script>

const data = JSON.parse(localStorage.getItem("struk"));

if(!data){
    alert("Data struk tidak ditemukan!");
    window.location.href="kasir.html";
}

document.getElementById("no").innerHTML = data.noTransaksi;
document.getElementById("tanggal").innerHTML = data.tanggal;
document.getElementById("jam").innerHTML = data.jam;
document.getElementById("kasir").innerHTML = data.kasir;
document.getElementById("metode").innerHTML = data.metode;
document.getElementById("total").innerHTML =
"Rp " + data.total.toLocaleString("id-ID");

let html="";

data.items.forEach(item=>{

let subtotal=item.qty*item.harga;

html += `
<tr>
<td>
<b>${item.nama}</b><br>
<small>${item.varian}</small>
</td>
<td align="center">${item.qty}</td>
<td class="right">
Rp ${subtotal.toLocaleString("id-ID")}
</td>
</tr>
`;

});

document.getElementById("isiStruk").innerHTML=html;

// Download PDF
function downloadPDF(){

const element=document.getElementById("printArea");

html2pdf().set({

margin:0,
filename:data.noTransaksi+".pdf",
image:{type:'jpeg',quality:1},
html2canvas:{scale:3},
jsPDF:{
unit:'mm',
format:[80,200],
orientation:'portrait'
}

}).from(element).save();

}
function kirimWA(){

    let nomor = document.getElementById("wa").value.trim();

    if(nomor==""){
        alert("Masukkan nomor WhatsApp pelanggan!");
        return;
    }

    // Ubah 08 menjadi 628
    if(nomor.startsWith("08")){
        nomor = "62" + nomor.substring(1);
    }

    let pesan =
`☕ *JERAMI COFFEE*

No Transaksi : ${data.noTransaksi}
Tanggal : ${data.tanggal}
Jam : ${data.jam}
Kasir : ${data.kasir}

-----------------------`;

    data.items.forEach(item=>{

        pesan += `

${item.nama} (${item.varian})
${item.qty} x Rp ${item.harga.toLocaleString("id-ID")}
= Rp ${(item.qty*item.harga).toLocaleString("id-ID")}`;

    });

    pesan += `

-----------------------
*TOTAL : Rp ${data.total.toLocaleString("id-ID")}*

Metode : ${data.metode}

🙏 Terima kasih telah berbelanja di Jerami Coffee`;

    let url =
`https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}`;

    window.open(url,"_blank");
}



// Rating
function rating(nilai){

let bintang=document.querySelectorAll(".star");

bintang.forEach((e,i)=>{

if(i<nilai){
e.classList.add("active");
e.innerHTML="★";
}else{
e.classList.remove("active");
e.innerHTML="☆";
}

});

document.getElementById("hasilRating").innerHTML =
"Rating : "+nilai+" / 5";

localStorage.setItem("rating",nilai);

}

</script>

</body>
</html>
